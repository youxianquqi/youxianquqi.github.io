<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>标签趋势 · 次元热度</title>
    <meta name="description" content="单个二次元网文标签的日/周热度趋势。" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("cyhd-theme");
          if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="tagheat-quill.svg" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">
        <span class="brand__mark">
          <img src="tagheat-quill.svg" alt="" width="34" height="34" />
        </span>
        <span class="brand__name">次元热度</span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="index.html">热榜</a>
        <a href="about.html">关于</a>
      </nav>
      <div class="topbar__side">
        <button class="theme-toggle" data-theme-toggle type="button" aria-label="切换深浅主题" title="切换深浅主题">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main class="wrap">
      <div class="page-head">
        <a class="back-link" href="index.html">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
          返回热榜
        </a>
        <h1 id="tag-title">标签趋势</h1>
        <div class="hit-chips" id="hit-chips"></div>
      </div>

      <div class="tag-summary" id="tag-summary"></div>

      <section class="chart-card">
        <div class="chart-card__controls">
          <div class="tabs" id="series-tabs" role="tablist" aria-label="数据序列切换"></div>
          <span class="spacer"></span>
          <div class="tabs" id="gran-tabs" role="tablist" aria-label="日周切换">
            <button type="button" data-gran="daily" class="is-active">日</button>
            <button type="button" data-gran="weekly">周</button>
          </div>
        </div>
        <div class="chart-box" id="chart-box">
          <canvas id="trend-chart"></canvas>
        </div>
        <div id="chart-status"></div>
      </section>
    </main>

    <footer class="footer">
      <p>次元热度 TagHeat · 多源公开标签汇总，非任何平台官方榜单</p>
      <p>周视图取 ISO 周内最后一个有数据日的分数，缺日不填充</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script type="module" src="js/tag-view.js"></script>
  </body>
</html>
