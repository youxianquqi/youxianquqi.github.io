<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>次元热度 · 二次元网文标签热榜</title>
    <meta name="description" content="看各平台二次元网文标签今天热什么、这周怎么变。多源采集 · 综合风向。" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("cyhd-theme");
          if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="tagheat-quill.svg" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">
        <span class="brand__mark">
          <img src="tagheat-quill.svg" alt="" width="34" height="34" />
        </span>
        <span class="brand__name">次元热度</span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="index.html" class="is-active">热榜</a>
        <a href="about.html">关于</a>
      </nav>
      <div class="topbar__side">
        <button class="theme-toggle" data-theme-toggle type="button" aria-label="切换深浅主题" title="切换深浅主题">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main class="wrap">
      <section class="hero">
        <h1 class="wordmark">
          <span class="grad-text">次元热度</span>
          <span class="wordmark__en">TagHeat</span>
        </h1>
        <div class="wind-line" id="wind-line" hidden>
          <span class="wind-line__label">今日风向</span>
          <span class="wind-line__text" id="wind-text"></span>
          <span class="wind-line__date" id="wind-date"></span>
        </div>
      </section>

      <section class="board" id="board">
        <div class="board__head">
          <h2 class="board__title">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
            细分风向榜
            <span class="board__date" id="board-date"></span>
          </h2>
          <div class="tabs" id="board-tabs" role="tablist" aria-label="数据源切换"></div>
          <div class="tabs tabs--kind" id="kind-tabs" role="tablist" aria-label="标签类型筛选">
            <button type="button" role="tab" data-kind="all" class="is-active" aria-selected="true" data-boards="merged,fandom">全部</button>
            <button type="button" role="tab" data-kind="trope" aria-selected="false" data-boards="merged">套路</button>
            <button type="button" role="tab" data-kind="moe" aria-selected="false" data-boards="merged">萌属性</button>
            <button type="button" role="tab" data-kind="ip" aria-selected="false" data-boards="merged,fandom">作品宇宙</button>
            <button type="button" role="tab" data-kind="fandom_structure" aria-selected="false" data-boards="fandom">同人结构</button>
            <button type="button" role="tab" data-kind="relationship" aria-selected="false" data-boards="merged,fandom">关系类型</button>
            <button type="button" role="tab" data-kind="genre" aria-selected="false" data-boards="merged">题材</button>
          </div>
          <div class="board__search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="search-input" placeholder="搜索标签，如：恶役千金" autocomplete="off" />
          </div>
          <div class="board__legend" id="board-legend"></div>
        </div>

        <div class="rank-head" id="rank-head" aria-hidden="true">
          <span class="col-no">#</span><span class="col-tag">标签</span><span class="col-score">Score</span><span class="col-delta">Δ</span><span class="col-dots">覆盖</span><span class="col-spark">近7日</span>
        </div>
        <ol class="rank-list" id="rank-list"></ol>
        <div id="board-status"></div>
      </section>
    </main>

    <footer class="footer">
      <p>次元热度 TagHeat · 多源公开标签汇总，非任何平台官方榜单</p>
      <p>多源公开榜单标签汇总 · 仅供题材风向参考</p>
    </footer>

    <script type="module" src="js/rank.js"></script>
  </body>
</html>
